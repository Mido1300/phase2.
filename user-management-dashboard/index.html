<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management System - Login</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --primary: #7f1d1d;
            --secondary: #b91c1c;
            --danger: #ef4444;
            --light: #f9fafb;
            --gray: #6b7280;
            --light-gray: #d1d5db;
            --bg-color: #f3f4f6;
            --text-color: #111827;
            --card-bg: #ffffff;
            --border-color: #e5e7eb;
            --shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            --shadow-sm: 0 4px 8px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 12px 24px rgba(0, 0, 0, 0.15);
            --gradient: linear-gradient(135deg, #7f1d1d, #dc2626);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 70%);
            pointer-events: none;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>
    <div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-[var(--primary)] to-[var(--secondary)] relative overflow-hidden login-container">
        <div class="login-card w-full max-w-md rounded-2xl shadow-[var(--shadow-lg)] p-12 text-center relative z-10">
            <h2 class="text-3xl font-bold text-[var(--primary)] mb-8">User Management System</h2>
            <form id="login-form">
                <div class="mb-6">
                    <label for="username" class="block text-left text-sm font-semibold text-[var(--text-color)] mb-2">Username</label>
                    <input type="text" id="username" placeholder="admin" class="w-full p-3 border border-[var(--border-color)] rounded-lg bg-[var(--card-bg)] text-[var(--text-color)] focus:outline-none focus:ring-2 focus:ring-[var(--primary)] focus:border-transparent shadow-[var(--shadow-sm)]" required>
                </div>
                <div class="mb-6">
                    <label for="password" class="block text-left text-sm font-semibold text-[var(--text-color)] mb-2">Password</label>
                    <input type="password" id="password" placeholder="12345" class="w-full p-3 border border-[var(--border-color)] rounded-lg bg-[var(--card-bg)] text-[var(--text-color)] focus:outline-none focus:ring-2 focus:ring-[var(--primary)] focus:border-transparent shadow-[var(--shadow-sm)]" required>
                </div>
                <button type="submit" class="w-full p-3 bg-gradient-to-r from-[var(--primary)] to-[var(--secondary)] text-white rounded-lg font-semibold text-lg shadow-[var(--shadow-sm)] hover:shadow-[var(--shadow)] hover:-translate-y-0.5 transition-all">Login</button>
                <p id="error-message" class="text-[var(--danger)] mt-4 text-sm hidden">Username or password do not match our records</p>
            </form>
        </div>
    </div>

    <script>
        // Login functionality
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('error-message');

            if (username === 'admin' && password === '12345') {
                localStorage.setItem('isLoggedIn', 'true');
                errorMessage.classList.add('hidden');
                window.location.href = 'dashboard.html';
            } else {
                errorMessage.classList.remove('hidden');
            }
        });

        // Check login state on load
        window.addEventListener('load', function() {
            if (localStorage.getItem('isLoggedIn') === 'true') {
                window.location.href = 'dashboard.html';
            }
        });
    </script>
</body>
</html>
